# Publishes the already-encrypted site/ folder to GitHub Pages.
# The report data never reaches GitHub: site/ is built and encrypted locally
# (npm run build). This workflow re-verifies the bundle before deploying.
# Optional repository secret DASHBOARD_PASSWORD enables the password scan and a
# decryption test in CI (Settings → Secrets and variables → Actions).
name: Deploy encrypted dashboard

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/verify.mjs'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify encrypted build (no plaintext password or report content)
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: node scripts/verify.mjs --ci

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
