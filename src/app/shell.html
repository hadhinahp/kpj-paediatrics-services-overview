  </button>
  <div class="brand">
    <img src="assets/kpj-logo.png" alt="KPJ Healthcare" width="146" height="34">

    <div class="brand-text">
      <div class="brand-title">Paediatrics Services Overview</div>
      <div class="brand-sub" id="brand-sub"></div>
    </div>
  </div>
  <div class="header-actions">
    <span class="status-pill"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3l9.5 17H2.5L12 3z"/><path d="M12 10v4M12 17h.01"/></svg>Draft<span class="long">&nbsp;for validation</span></span>

<div class="layout">

    <ul class="nav" id="nav"></ul>
    <div class="sidebar-foot" id="sidebar-foot"></div>
  </nav>
  <div class="scrim" id="scrim" hidden></div>
  <main class="main" id="main" tabindex="-1">

</div>

    </div>
    <button type="button" class="btn btn-sm dlg-close" id="dlg-close" data-act="dlg-close">
